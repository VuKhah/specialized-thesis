# Mamba-CTC. n_layers=28 chọn 2026-09-24 để khớp tham số với
# model_conformer.yaml: 12.292.352 vs 12.204.288 (+0,72%, mục tiêu < 5%) — số
# đếm theo shape của mamba_ssm.Mamba v2.3.1, cần xác nhận lại bằng
# `python -m src.models.param_count` trên Kaggle. Giữ expand=2 mặc định bài
# gốc, chỉ tăng độ sâu; d_model=256 để CTC head giống hệt Conformer.
experiment_name: mamba_ctc

encoder:
  type: mamba
  input_dim: 80
  d_model: 256
  n_layers: 28 # 1 Mamba block ~0,44M tham số, 1 Conformer block ~1,5M
  d_state: 16
  d_conv: 4
  expand: 2

tokenizer:
  vocab_size: 1000 # PHẢI khớp với model_conformer.yaml (dùng chung tokenizer)

training:
  batch_size: 16
  lr: 3.0e-4 # PyYAML doc "3e-4" (khong co dau cham) thanh string, khong phai float
  epochs: 30
  warmup_steps: 1000
  grad_clip: 5.0

data:
  train_split: train
  eval_split: validation
  sample_rate: 16000
