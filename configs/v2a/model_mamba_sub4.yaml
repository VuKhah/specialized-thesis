# Công thức chung v2a — người dùng duyệt 2026-10-12 phương án "A + 40 ms" (thay bộ v2 ở configs/v2/,
# docs/notes/conextbimamba_gap_2026-10-12.md mục 7-8): công thức v1 GIỮ NGUYÊN (LR 3e-4, warmup 1000,
# batch 16, wd 0,01, SpecAugment, speed perturb, bucketing, seed 42) + pha giảm LR 1-sqrt ở 8 epoch cuối
# (WSD; Hägele và cs., arXiv:2405.18392) → 38 epoch = 30 hằng + 8 giảm. Không InterCTC/self-conditioning.
# Mọi trường ngoài experiment_name / epochs / decay_epochs / encoder / subsampling PHẢI giống v1.
# Lần chạy (3): nhánh 40 ms (subsampling 4×), train TỪ ĐẦU 38 epoch, 1 seed.
# v1: Mamba-CTC. 2026-10-02 chuyển sang hai chiều phương án B1
# v1: (docs/notes/mamba_bidirectional.md): 14 lớp × 2 khối Mamba (xuôi + ngược,
# v1: chung LayerNorm) = vẫn 28 khối như bản một chiều n_layers=28 chọn
# v1: 2026-09-24 để khớp tham số với model_conformer.yaml. Tính theo shape
# v1: mamba_ssm.Mamba v2.3.1: 12.285.696 vs 12.204.288 (+0,67%, mục tiêu < 5%) —
# v1: cần xác nhận bằng `python -m src.models.param_count` trên Kaggle. Giữ
# v1: expand=2 mặc định bài gốc, chỉ tăng độ sâu; d_model=256 để CTC head giống
# v1: hệt Conformer. Bản một chiều (ablation/thảo luận): bidirectional: false,
# v1: n_layers: 28 → 12.292.864.

experiment_name: v2a_s4_mamba

encoder:
  type: mamba
  input_dim: 256 # = đầu ra Conv2dSubsampling4
  d_model: 256
  n_layers: 14 # số lớp; mỗi lớp 2 khối khi bidirectional. 1 khối Mamba ~0,44M tham số, 1 Conformer block ~1,5M
  bidirectional: true
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.1 # = Conformer; 2405.12609, ConMamba (thêm 2026-10-04)

subsampling: # nhánh 40 ms: Conv2d 2×(3×3, stride 2), 256 kênh (ESPnet Conv2dSubsampling)
  type: conv2d4
  channels: 256

tokenizer:
  vocab_size: 1000 # PHẢI khớp với model_conformer.yaml (dùng chung tokenizer)

training:
  batch_size: 16
  lr: 3.0e-4 # PyYAML doc "3e-4" (khong co dau cham) thanh string, khong phai float
  epochs: 38 # = 30 hằng (như v1) + 8 giảm
  decay_epochs: 8 # 1-sqrt về 0 ở 8 epoch cuối (~21%; Hägele 2024: ~20%)
  warmup_steps: 1000
  grad_clip: 5.0
  # = mặc định AdamW trước 2026-09-30, ghi rõ ra. Tham số `_no_weight_decay`
  # (A_log, D của Mamba) được miễn — xem build_optimizer trong train.py.
  weight_decay: 0.01
  seed: 42 # khởi tạo + thứ tự dữ liệu; giống nhau ở hai tài khoản Kaggle (D10)
  amp: true # fp16 autocast trên GPU (D8); CPU tự tắt
  num_workers: 2 # mỗi tiến trình (D8)
  # Bucketing theo độ dài (chốt 2026-10-05): xếp trong cụm 50 batch toàn cục (~800 câu),
  # 0 = tắt. PHẢI giống nhau ở mọi config train từ đầu.
  bucket_pool_batches: 50

# Front-end dùng chung — PHẢI giống hệt nhau ở mọi config train từ đầu
# (src/features/log_mel.py, thêm 2026-10-04).
features:
  cmvn_stats: configs/cmvn_stats.json
  spec_augment: # chỉ lúc train; theo Conformer (Gulati 2020), không time warping
    freq_masks: 2
    freq_width: 27
    time_masks: 10
    time_ratio: 0.05

data:
  # data/splits/*.tsv (make_shards.py), đã bỏ excluded.tsv (A1) khi đọc.
  # Train thử 1 shard: --train_manifests train_shard0.
  train_manifests: [train_shard0, train_shard1, train_shard2, train_shard3]
  eval_manifest: val # chọn best.pt: validation trừ clean-test cũ (D5), trừ video giữ riêng
  extra_eval_manifests: [val_unseen] # video giữ riêng (make_heldout.py), chỉ ghi log
  sample_rate: 16000
  # Speed perturbation on-the-fly lúc train (Ko 2015; chốt 2026-10-05,
  # docs/notes/audio_preprocessing_survey.md mục 5). PHẢI giống nhau ở mọi config train từ đầu.
  speed_perturb: [0.9, 1.0, 1.1]
